<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Page Not Found | iTech IT Solutions</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#071c3b,#0d2d5a);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.error-box{
  width:100%;
  max-width:620px;
  text-align:center;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:28px;
  padding:45px 25px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
}

.logo{
  width:100px;
  height:100px;
  object-fit:contain;
  margin-bottom:20px;
}

.error-code{
  font-size:clamp(70px,18vw,130px);
  font-weight:900;
  line-height:1;
  color:#ff8a00;
}

h1{
  margin-top:18px;
  font-size:clamp(26px,6vw,42px);
}

p{
  margin-top:14px;
  color:#dbe7f7;
  line-height:1.7;
  font-size:16px;
}

.home-btn{
  display:inline-block;
  margin-top:28px;
  padding:14px 28px;
  border-radius:12px;
  background:#ff8a00;
  color:#fff;
  text-decoration:none;
  font-weight:800;
  transition:.25s ease;
}

.home-btn:hover{
  transform:translateY(-2px);
  background:#ff9d2e;
}

.brand{
  margin-top:24px;
  font-size:14px;
  color:#cbd8ea;
  font-weight:700;
}

@media(max-width:600px){
  body{
    padding:16px;
  }

  .error-box{
    padding:38px 20px;
    border-radius:22px;
  }

  .logo{
    width:82px;
    height:82px;
  }
}
</style>
  <link rel="stylesheet" href="../css/mobile-app-ready.css">
</head>

<body>

<div class="error-box">

  <img
    src="/assets/itech-logo.png"
    class="logo"
    alt="iTech IT Solutions">

  <div class="error-code">404</div>

  <h1>Page Not Found</h1>

  <p>
    Sorry, the page you are looking for does not exist
    or may have been moved.
  </p>

  <a href="/" class="home-btn">
    ← Back to Home
  </a>

  <div class="brand">
    iTech IT Solutions · Nedumangad
  </div>

</div>

</body>
</html>
