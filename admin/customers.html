<header class="dash-header"><a class="brand" href="dashboard.html"><img class="brand-logo" src="../assets/itech-logo.png" alt="iTech IT Solutions"> </a><div class="header-actions"><span class="user-chip" data-admin-name>Admin</span><a class="btn secondary" href="../pages/login.html" data-logout>Logout</a></div></header>
<div class="dash-layout"><aside class="sidebar"><nav>

</nav></aside><main class="dash-main"><div class="toolbar"><div><p class="eyebrow">CUSTOMER MANAGEMENT</p><h1>Customers</h1></div><a class="btn primary" href="add-customer.html">+ Add Customer</a></div>
<section class="panel"><div class="search-row"><input id="search" placeholder="Search by customer name or mobile…"><span id="count" class="muted"></span></div>
<div class="table-scroll"><table class="data-table"><thead><tr><th>Customer</th><th>Mobile</th><th>Opening</th><th>Total Work</th><th>Paid</th><th>Balance</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody></table></div></section>
<div data-status class="status"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script>
<script>
(async()=>{
 const ok=await requireStaff(); if(!ok)return;
 const {data,error}=await sb.from("customer_balances").select("*").order("full_name");
 if(error)return showStatus(error.message,true);
 const rows=document.getElementById("rows"), search=document.getElementById("search");
 const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2});
 function render(){
  const q=search.value.toLowerCase();
  const list=data.filter(c=>(c.full_name||"").toLowerCase().includes(q)||(c.mobile||"").includes(q));
  document.getElementById("count").textContent=list.length+" customers";
  rows.innerHTML=list.map(c=>`<tr><td><b>${c.full_name}</b><small>${c.customer_code||""}</small></td><td>${c.mobile}</td><td>${money(c.opening_balance)}</td><td>${money(c.total_work)}</td><td>${money(c.total_paid)}</td><td><b>${money(c.current_balance)}</b></td><td><a class="btn primary" href="customer-profile.html?id=${c.id}">View</a></td></tr>`).join("")||'<tr><td colspan="7">No customers found.</td></tr>';
 }
 search.addEventListener("input",render); render();
})();
</script></body></html>
