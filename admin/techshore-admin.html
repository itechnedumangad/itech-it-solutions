<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Techshore Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#eef4fb;color:#102a43}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.brand{font-size:28px;font-weight:900}.muted{color:#6b7f95}.card{background:#fff;border-radius:20px;box-shadow:0 12px 35px #17324d18;padding:24px;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:20px;border:1px solid #d9e4ef;border-radius:15px}.stat b{display:block;font-size:30px;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}input,select{padding:12px;border:1px solid #ccd8e5;border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:#0b4f8a;color:#fff}.btn.danger{background:#c62828}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:16px;min-width:800px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e5edf5}th{font-size:12px;text-transform:uppercase;color:#60758c}.pill{padding:5px 9px;border-radius:15px;background:#e8f6ee;color:#147a3e;font-weight:800;font-size:12px}.hidden{display:none}.bar{height:8px;background:#e5edf5;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#0b4f8a}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
<div class="brand">TECHSHORE <span class="muted">Admin</span></div>
<p class="muted">Quiz attempts, task-wise marks and student performance.</p>
<div class="stats">
<div class="stat"><span class="muted">Total Attempts</span><b id="total">0</b></div>
<div class="stat"><span class="muted">Students</span><b id="students">0</b></div>
<div class="stat"><span class="muted">Average %</span><b id="avg">0%</b></div>
<div class="stat"><span class="muted">Best Score</span><b id="best">0/50</b></div>
</div>
<div class="card">
<div class="toolbar"><input id="search" placeholder="Search name / mobile" oninput="render()"><select id="task" onchange="render()"><option value="">All Tasks</option></select><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn danger" onclick="clearReports()">Clear Reports</button></div>
<div class="tablewrap"><table><thead><tr><th>Student</th><th>Mobile</th><th>Task</th><th>Score</th><th>Percentage</th><th>Completed</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</div>
<script>
const KEY="techshore_quiz_reports_v1";
function get(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function render(){
 const all=get(), s=document.getElementById("search").value.toLowerCase(), t=document.getElementById("task").value;
 const data=all.filter(r=>(!s||r.name.toLowerCase().includes(s)||r.mobile.includes(s))&&(!t||String(r.task)===t));
 document.getElementById("total").textContent=all.length;
 document.getElementById("students").textContent=new Set(all.map(r=>r.mobile)).size;
 document.getElementById("avg").textContent=(all.length?(all.reduce((x,r)=>x+r.percentage,0)/all.length).toFixed(1):0)+"%";
 document.getElementById("best").textContent=(all.length?Math.max(...all.map(r=>r.score)):0)+"/50";
 document.getElementById("rows").innerHTML=data.length?data.slice().reverse().map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.mobile)}</td><td><span class="pill">Task ${r.task}</span></td><td><b>${r.score}/50</b><div class="bar"><i style="width:${r.percentage}%"></i></div></td><td>${r.percentage}%</td><td>${new Date(r.completedAt).toLocaleString()}</td></tr>`).join(""):`<tr><td colspan="6" class="muted">No reports found.</td></tr>`;
}
function setup(){let s=document.getElementById("task");for(let i=1;i<=10;i++){let o=document.createElement("option");o.value=i;o.textContent="Task "+i;s.appendChild(o)}render()}
function exportCSV(){
 const rows=get();let csv="Name,Mobile,Task,Score,Total,Percentage,Started,Completed\n";
 rows.forEach(r=>csv+=`"${r.name.replace(/"/g,'""')}","${r.mobile}",${r.task},${r.score},${r.total},${r.percentage},"${r.startedAt}","${r.completedAt}"\n`);
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="techshore-quiz-reports.csv";a.click();URL.revokeObjectURL(a.href)
}
function clearReports(){if(confirm("Delete all quiz reports from this browser?")){localStorage.removeItem(KEY);render()}}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
setup();
</script></body></html>
