<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Techshore Admin - Quiz Results</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#eef5fb;color:#092c50}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:30px;font-weight:950}.brand span{color:#7a8ea3}.muted{color:#6b8196}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:900;cursor:pointer;background:#0b4f8a;color:#fff}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat,.card{background:#fff;border:1px solid #d9e6f1;border-radius:20px;box-shadow:0 14px 35px rgba(23,50,77,.08)}.stat{padding:20px}.stat b{display:block;font-size:30px;margin-top:7px}.card{padding:20px;margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}input,select{padding:12px;border:1px solid #ccd9e6;border-radius:10px;font-size:14px;background:#fff}.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f2f7fb;color:#557089;font-size:13px;font-weight:800}.status.ok{background:#e8f8ee;color:#16743d}.status.err{background:#feeceb;color:#b42318}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px;margin-top:12px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e5edf5}th{font-size:11px;color:#60758c;text-transform:uppercase}.pill{padding:5px 9px;border-radius:14px;background:#e8f6ee;color:#147a3e;font-weight:900;font-size:12px}.bar{height:7px;background:#e5edf5;border-radius:10px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#0b67a8}.empty{padding:30px;text-align:center;color:#6b7f95}.authbox{margin-top:15px;padding:12px 14px;border-radius:12px;background:#f6f9fc;border:1px solid #e0e9f2;font-size:13px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.stats{grid-template-columns:1fr}.wrap{padding:18px 12px}.card{padding:14px}.brand{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="brand">TECHSHORE <span>Admin</span></div><div class="muted">Cloud-synced quiz attempts, task-wise marks and student performance.</div></div>
    <button class="btn" onclick="location.href='dashboard.html'">← Admin Dashboard</button>
  </div>
  <div id="authBox" class="authbox">Checking admin session…</div>
  <div class="stats">
    <div class="stat"><span class="muted">Total Attempts</span><b id="total">0</b></div>
    <div class="stat"><span class="muted">Students</span><b id="students">0</b></div>
    <div class="stat"><span class="muted">Average %</span><b id="avg">0%</b></div>
    <div class="stat"><span class="muted">Best Score</span><b id="best">0/50</b></div>
  </div>
  <div class="card">
    <div class="toolbar">
      <input id="search" placeholder="Search name / mobile" oninput="render()">
      <select id="task" onchange="render()"><option value="">All Tasks</option></select>
      <button class="btn" onclick="load()">↻ Refresh</button>
      <button class="btn" onclick="exportCSV()">Export CSV</button>
    </div>
    <div id="status" class="status">Waiting for connection…</div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Student</th><th>Mobile</th><th>Task</th><th>Score</th><th>Percentage</th><th>Completed</th><th>Status</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>
let sb=null,all=[],adminReady=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function cfg(){const c=window.APP_CONFIG||{};return {url:c.SUPABASE_URL||'https://qllprfglsnkpvgqilhze.supabase.co',key:c.SUPABASE_PUBLISHABLE_KEY||c.SUPABASE_ANON_KEY||c.SUPABASE_KEY||'sb_publishable_BjgtqhMLpDYTLMLjmQWflg_KxTiH_dW'};}
async function init(){
 try{
   const c=cfg();
   if(!window.supabase)throw new Error('Supabase library did not load');
   if(!c.url||!c.key)throw new Error('Supabase configuration missing');
   sb=window.supabase.createClient(c.url,c.key);
   const {data,error}=await sb.auth.getUser();
   if(error)throw error;
   if(!data?.user)throw new Error('Admin login required. Please sign in to the iTech Admin Dashboard first.');
   const {data:role,error:roleError}=await sb.from('user_roles').select('role').eq('user_id',data.user.id).maybeSingle();
   if(roleError)throw new Error('Unable to read admin role: '+roleError.message);
   const r=String(role?.role||'').toLowerCase().trim();
   if(r!=='admin'&&r!=='staff')throw new Error('Access denied. Admin/Staff account required.');
   adminReady=true;
   $('authBox').textContent='✓ Signed in: '+(data.user.email||'Admin')+' • Role: '+r;
   $('authBox').style.color='#16743d';
   for(let i=1;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent='Task '+i;$('task').appendChild(o)}
   await load();
 }catch(e){
   $('authBox').textContent='⚠ '+e.message;$('authBox').style.color='#b42318';
   $('status').textContent='Connection/authentication failed: '+e.message;$('status').className='status err';
   $('rows').innerHTML='<tr><td colspan="7" class="empty">Could not load cloud results.</td></tr>';
   console.error(e);
 }
}
async function load(){
 if(!adminReady||!sb)return;
 $('status').textContent='Loading cloud results…';$('status').className='status';
 try{
   const {data,error}=await sb.from('techshore_quiz_results').select('*').order('completed_at',{ascending:false});
   if(error)throw error;
   all=data||[];
   $('status').textContent=all.length?'✓ '+all.length+' cloud results loaded':'Connected — no cloud results yet';
   $('status').className='status '+(all.length?'ok':'');
   render();
 }catch(e){
   $('status').textContent='Database error: '+e.message;$('status').className='status err';
   $('rows').innerHTML='<tr><td colspan="7" class="empty">'+esc(e.message)+'</td></tr>';
   console.error(e);
 }
}
function render(){
 const s=$('search').value.trim().toLowerCase(),t=$('task').value;
 const data=all.filter(r=>(!s||String(r.student_name||'').toLowerCase().includes(s)||String(r.student_mobile||'').includes(s))&&(!t||String(r.task)===t));
 $('total').textContent=all.length;$('students').textContent=new Set(all.map(r=>r.student_mobile)).size;
 $('avg').textContent=(all.length?(all.reduce((x,r)=>x+Number(r.percentage||0),0)/all.length).toFixed(1):0)+'%';
 $('best').textContent=(all.length?Math.max(...all.map(r=>Number(r.score||0))):0)+'/50';
 $('rows').innerHTML=data.length?data.map(r=>`<tr><td><b>${esc(r.student_name)}</b></td><td>${esc(r.student_mobile)}</td><td><span class="pill">Task ${esc(r.task)}</span></td><td><b>${esc(r.score)}/${esc(r.total||50)}</b><div class="bar"><i style="width:${Math.min(100,Math.max(0,Number(r.percentage||0)))}%"></i></div></td><td>${Number(r.percentage||0)}%</td><td>${r.completed_at?new Date(r.completed_at).toLocaleString('en-IN'):'—'}</td><td>${r.timed_out?'Time Out':'Completed'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No reports found.</td></tr>';
}
function exportCSV(){const rows=all;let csv='Name,Mobile,Task,Score,Total,Percentage,Started,Completed,TimedOut\n';rows.forEach(r=>csv+=`"${String(r.student_name||'').replace(/"/g,'""')}","${r.student_mobile||''}",${r.task},${r.score},${r.total},${r.percentage},"${r.started_at||''}","${r.completed_at||''}",${r.timed_out}\n`);const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='techshore-quiz-cloud-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
init();
</script>
</body>
</html>
