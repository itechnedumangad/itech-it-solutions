<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Techshore Quiz Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#eef4fb;color:#102a43}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:30px;font-weight:950}.brand span{color:#7b8da1}.muted{color:#6b7f95}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat,.card{background:#fff;border:1px solid #dce7f1;border-radius:20px;box-shadow:0 14px 35px rgba(23,50,77,.08)}.stat{padding:20px}.stat b{display:block;font-size:30px;margin-top:7px}.card{padding:20px;margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}input,select{padding:12px;border:1px solid #ccd8e5;border-radius:10px;font-size:14px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer;background:#0b4f8a;color:#fff}.btn.danger{background:#c62828}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px;margin-top:14px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e5edf5}th{font-size:11px;color:#60758c;text-transform:uppercase}.pill{padding:5px 9px;border-radius:14px;background:#e8f6ee;color:#147a3e;font-weight:900;font-size:12px}.bar{height:8px;background:#e5edf5;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#0b67a8}.status{margin-top:12px;font-size:12px;font-weight:800}.score-card-preview{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:#6b7f95}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.stats{grid-template-columns:1fr}.wrap{padding:18px 12px}.card{padding:14px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">TECHSHORE <span>Admin</span></div><p class="muted">Cloud-synced quiz attempts, task-wise marks and student performance.</p></div><button class="btn" onclick="location.href='dashboard.html'">← Admin Dashboard</button></div><div class="stats"><div class="stat"><span class="muted">Total Attempts</span><b id="total">0</b></div><div class="stat"><span class="muted">Students</span><b id="students">0</b></div><div class="stat"><span class="muted">Average %</span><b id="avg">0%</b></div><div class="stat"><span class="muted">Best Score</span><b id="best">0/50</b></div></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search name / mobile" oninput="render()"><select id="task" onchange="render()"><option value="">All Tasks</option></select><button class="btn" onclick="load()">↻ Refresh</button><button class="btn" onclick="exportCSV()">Export CSV</button></div><div id="status" class="status muted">Connecting to cloud…</div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Mobile</th><th>Task</th><th>Score</th><th>Percentage</th><th>Completed</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>let sb=null,all=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function init(){try{if(!window.supabase||!window.APP_CONFIG)throw new Error('Supabase config missing');sb=window.supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);if(window.requireAdmin){const ok=await requireAdmin();if(!ok)return;}for(let i=1;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent='Task '+i; $('task').appendChild(o)}await load()}catch(e){$('status').textContent='Unable to connect: '+e.message;$('status').style.color='#c62828'}}async function load(){if(!sb)return; $('status').textContent='Loading cloud results…';const {data,error}=await sb.from('techshore_quiz_results').select('*').order('completed_at',{ascending:false});if(error){$('status').textContent='Database error: '+error.message;$('status').style.color='#c62828';return}all=data||[];$('status').textContent=all.length?('✓ '+all.length+' cloud results loaded'):'No cloud results yet';$('status').style.color=all.length?'#147a3e':'#6b7f95';render()}function render(){const s=$('search').value.trim().toLowerCase(),t=$('task').value;const data=all.filter(r=>(!s||String(r.student_name).toLowerCase().includes(s)||String(r.student_mobile).includes(s))&&(!t||String(r.task)===t));$('total').textContent=all.length;$('students').textContent=new Set(all.map(r=>r.student_mobile)).size;$('avg').textContent=(all.length?(all.reduce((x,r)=>x+Number(r.percentage||0),0)/all.length).toFixed(1):0)+'%';$('best').textContent=(all.length?Math.max(...all.map(r=>Number(r.score||0))):0)+'/50';$('rows').innerHTML=data.length?data.map(r=>`<tr><td><b>${esc(r.student_name)}</b></td><td>${esc(r.student_mobile)}</td><td><span class="pill">Task ${r.task}</span></td><td><b>${r.score}/${r.total}</b><div class="bar"><i style="width:${Number(r.percentage||0)}%"></i></div></td><td>${Number(r.percentage||0)}%</td><td>${new Date(r.completed_at).toLocaleString('en-IN')}</td><td>${r.timed_out?'Time Out':'Completed'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No reports found.</td></tr>'}function exportCSV(){const rows=all;let csv='Name,Mobile,Task,Score,Total,Percentage,Started,Completed,TimedOut
';rows.forEach(r=>csv+=`"${String(r.student_name).replace(/"/g,'""')}","${r.student_mobile}",${r.task},${r.score},${r.total},${r.percentage},"${r.started_at||''}","${r.completed_at||''}",${r.timed_out}
`);const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='techshore-quiz-cloud-results.csv';a.click();URL.revokeObjectURL(a.href)}init();</script></body></html>
