</nav></aside><main class="dash-main"><div class="toolbar"><div><p class="eyebrow">WORK SHOWCASE</p><h1>Our Works</h1></div></div><section class="modern-panel"><div class="section-title"><div><h2>Our Works</h2><p class="muted">Live project showcase from Supabase.</p></div><input id="search" class="filter" placeholder="Search works..."></div><div id="cards" class="grid"><p class="muted">Loading...</p></div></section><div data-status class="status"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>(async()=>{const a=await requireAdmin();if(!a)return;let rows=[];const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");const r=await sb.from("work_showcase").select("*").order("created_at",{ascending:false});if(r.error)return showStatus(r.error.message,true);rows=r.data||[];function render(d){document.getElementById("cards").innerHTML=d.length?d.map(x=>`<article class="card"><div class="icon">🛠️</div><h3>${esc(x.title||x.name||x.project_name||"Project")}</h3><p class="muted">${esc(x.description||x.details||x.category||"")}</p></article>`).join(""):`<p class="muted">No works available.</p>`}render(rows);document.getElementById("search").oninput=e=>{const q=e.target.value.toLowerCase();render(rows.filter(x=>Object.values(x).some(v=>String(v??"").toLowerCase().includes(q))))}})();</script></body></html>
