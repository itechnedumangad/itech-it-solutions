<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09244b"><title>Product Master & Stock | iTech</title><link rel="stylesheet" href="css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script></head><body><header class="top"><a class="brand" href="dashboard.html"><img src="../assets/itech-logo-color.png" alt="iTech"><span>iTech Items Master<small>Shared CCTV + Computer Products</small></span></a><a class="btn secondary" href="../cctv/pages/dashboard.html">CCTV Dashboard ↗</a></header><div class="layout"><aside data-nav></aside><main><div class="head"><div><h1>Product Master & Stock</h1><div class="muted">One item list for CCTV and Computer Sales. Each item can have a category and subcategory.</div></div><div class="actions"><a class="btn orange" href="quick-invoice.html">＋ Quick Sales</a><a class="btn secondary" href="quotations.html">Create Quotation</a></div></div><section class="panel"><h2>Add / Edit Item</h2><form id="form"><input type="hidden" name="id"><div class="formgrid"><div class="field"><label>Item Name *</label><input name="name" required placeholder="e.g. 24 inch Monitor"></div><div class="field"><label>Item Code / SKU</label><input name="sku"></div><div class="field"><label>Barcode</label><input name="barcode"></div><div class="field"><label>Category *</label><select name="category" id="category" required><option value="Computer">Computer</option><option value="CCTV">CCTV</option><option value="Both">Both</option><option value="Networking">Networking</option><option value="Accessories">Accessories</option><option value="Services">Services</option><option value="Other">Other</option></select></div><div class="field"><label>Subcategory *</label><input name="subcategory" id="subcategory" list="subcats" required placeholder="e.g. Monitor, HDD, Camera"><datalist id="subcats"><option>Monitor</option><option>Desktop</option><option>Laptop</option><option>RAM</option><option>SSD / HDD</option><option>Keyboard & Mouse</option><option>Printer</option><option>Ink / Toner</option><option>CCTV Camera</option><option>DVR / NVR</option><option>Hard Disk</option><option>Power Supply</option><option>LAN Cable</option><option>Connector</option><option>Installation Service</option><option>Repair Service</option></datalist></div><div class="field"><label>Brand</label><input name="brand"></div><div class="field"><label>Unit</label><select name="unit"><option>Nos</option><option>Meter</option><option>Box</option><option>Set</option><option>Roll</option><option>Service</option></select></div><div class="field"><label>Cost Price (₹)</label><input name="cost_price" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Sales Price (₹) *</label><input name="sales_price" type="number" min="0" step="0.01" required value="0"></div><div class="field"><label>GST %</label><input name="tax_rate" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Opening Stock</label><input name="opening_stock" type="number" step="0.001" value="0"></div><div class="field"><label>Low Stock Alert</label><input name="low_stock_level" type="number" step="0.001" value="2"></div><div class="field"><label>Allow Negative Stock</label><select name="allow_negative_stock"><option value="true">Yes — warn only</option><option value="false">No</option></select></div></div><p class="actions"><button class="btn" type="submit">Save Item</button><button class="btn secondary" type="reset">Clear</button></p></form></section><section class="panel"><h2>Shared Item List</h2><div class="formgrid" style="margin-bottom:12px"><div class="field"><label>Search item / code / barcode</label><input id="search" placeholder="Search items"></div><div class="field"><label>Category filter</label><select id="catFilter"><option value="">All categories</option><option>Computer</option><option>CCTV</option><option>Both</option><option>Networking</option><option>Accessories</option><option>Services</option><option>Other</option></select></div><div class="field"><label>Subcategory filter</label><input id="subFilter" placeholder="e.g. Monitor"></div></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code / Barcode</th><th>Category</th><th>Subcategory</th><th>Rate</th><th>Stock</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted" id="count"></p></section><div id="toast" class="note" hidden style="position:fixed;bottom:18px;right:18px;z-index:8"></div></main></div><script src="js/common.js"></script><script src="js/items.js"></script></body></html>
