<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase Entry | iTech Computer Sales</title><link rel="stylesheet" href="css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script>
    <script src="../js/module-access-guard.js" defer></script></head><body><header class="top"><a class="brand" href="dashboard.html"><img src="../assets/itech-logo-color.png" alt="iTech"><span>iTech Computer Sales<small>Sales, Billing & Inventory</small></span></a><a class="btn secondary" href="../cctv/pages/dashboard.html">CCTV Dashboard ↗</a></header><div class="layout"><aside data-nav></aside><main><div class="head"><div><h1>Purchase Entry</h1><div class="muted">Computer Sales & Billing workspace</div></div><div class="actions"><a class="btn orange" href="quick-invoice.html">＋ Quick Invoice</a></div></div><section class="panel"><h2>Purchase Entry (adds stock)</h2><form id="purchaseForm"><div class="formgrid"><div class="field"><label>Supplier Name *</label><input name="supplier_name" required></div><div class="field"><label>Supplier Invoice No.</label><input name="supplier_invoice_no"></div><div class="field"><label>Purchase Date</label><input name="purchase_date" type="date" required></div><div class="field"><label>Product</label><select id="product" required></select></div><div class="field"><label>Quantity</label><input name="quantity" id="qty" type="number" min="0.001" step="0.001" required value="1"></div><div class="field"><label>Unit Cost</label><input name="unit_cost" id="cost" type="number" min="0" step="0.01" required value="0"></div><div class="field"><label>Paid Amount</label><input name="paid_amount" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Payment Method</label><select name="payment_method"><option>Cash</option><option>UPI</option><option>Bank</option><option>Credit</option><option>Partial</option></select></div><div class="field"><label>Notes</label><input name="notes"></div></div><p><button class="btn">Save Purchase & Add Stock</button></p></form></section><section class="panel"><h2>Recent Purchases</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></div></section><div id="toast" class="note" hidden style="position:fixed;bottom:18px;right:18px;z-index:8"></div></main></div><script src="js/common.js"></script><script src="js/purchases.js"></script></body></html>
