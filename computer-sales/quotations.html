<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotation | iTech Computer Sales</title><link rel="stylesheet" href="css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script>
    <script src="../js/module-access-guard.js" defer></script><link rel="stylesheet" href="../css/itech-redesign.css">
<script src="../js/itech-redesign.js"></script>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
</head><body><header class="top"><a class="brand" href="dashboard.html"><img src="../assets/itech-logo-color.png" alt="iTech"><span>iTech Quotation<small>Shared CCTV + Computer Items</small></span></a><a class="btn secondary" href="../cctv/pages/quotations.html">CCTV Quotations ↗</a></header><div class="layout"><aside data-nav></aside><main><div class="head"><div><h1>New Quotation</h1><div class="muted">Quotation does not reduce stock. Items come from shared Items master.</div></div><a class="btn orange" href="items.html">＋ Add Missing Item</a></div><section class="panel"><div class="formgrid"><div class="field"><label>Quotation No.</label><input id="qno" readonly></div><div class="field"><label>Customer name (optional)</label><input id="customer" placeholder="Enter customer name"></div><div class="field"><label>Job ID (optional)</label><input id="job" placeholder="Job ID"></div><div class="field"><label>Item search</label><input id="search" placeholder="Name, code or barcode"></div><div class="field"><label>Category filter</label><select id="cat"><option value="">All categories</option><option>Computer</option><option>CCTV</option><option>Both</option><option>Networking</option><option>Accessories</option><option>Services</option><option>Other</option></select></div><div class="field"><label>Item</label><select id="product"><option value="">Select item</option></select></div><div class="field"><label>Qty</label><input id="qty" type="number" min="0.001" step="0.001" value="1"></div><div class="field"><label>Rate</label><input id="rate" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>GST %</label><input id="tax" type="number" min="0" step="0.01" value="0"></div></div><p><button class="btn" id="add" type="button">Add Item</button></p><div class="tablewrap"><table><thead><tr><th>Item</th><th>Category / Subcategory</th><th>Qty</th><th>Rate</th><th>Tax</th><th>Total</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><div class="totalbox"><div class="totalrow"><span>Subtotal</span><b id="sub">₹0.00</b></div><div class="totalrow"><span>GST</span><b id="gst">₹0.00</b></div><div class="totalrow final"><span>Total</span><b id="total">₹0.00</b></div></div><p class="actions"><button class="btn orange" id="print" type="button">Print / Save PDF</button><button class="btn secondary" id="clear" type="button">Clear</button></p></section><div id="toast" class="note" hidden></div></main></div><script src="js/common.js"></script><script src="js/quotation.js"></script></body></html>
