<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password | iTech</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/unified-dashboard.css"><style>.pw-card{max-width:520px;margin:30px auto}</style><link rel="stylesheet" href="../css/dashboard-shell.css">
<link rel="stylesheet" href="../css/ui-enhancements.css">
  <link rel="stylesheet" href="../css/mobile-app-ready.css">
</head><body><header class="dash-header"><a class="brand" href="dashboard.html"><img class="brand-logo" src="../assets/itech-logo.png" alt="iTech IT Solutions"></a><a class="btn secondary" href="../pages/login.html" data-logout>Logout</a></header><main class="container"><section class="panel form pw-card"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change Password</h1><p class="muted">Your account is using a temporary password. Please set a new password before continuing.</p><label class="field">New Password<input id="p1" type="password" minlength="6" required></label><label class="field">Confirm New Password<input id="p2" type="password" minlength="6" required></label><button id="save" class="btn primary" type="button">Change Password</button><div data-status class="status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>(async()=>{const a=await requireCustomer();if(!a)return;document.getElementById('save').onclick=async()=>{const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1.length<6)return showStatus('Password must contain at least 6 characters.',true);if(p1!==p2)return showStatus('Passwords do not match.',true);const session=(await sb.auth.getSession()).data.session;if(!session)return showStatus('Session expired. Please login again.',true);showStatus('Changing password…');const r=await fetch(`${window.APP_CONFIG.SUPABASE_URL}/functions/v1/change-customer-password`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({password:p1})});const j=await r.json().catch(()=>({}));if(!r.ok)return showStatus(j.message||'Unable to change password.',true);showStatus('Password changed successfully.');setTimeout(()=>location.href='dashboard.html',700)}})();</script>
<script id="itech-mobile-navigation">
(function(){
  const header=document.querySelector(".dash-header");
  const sidebar=document.querySelector(".sidebar");
  if(!header || !sidebar || document.getElementById("uiMobileMenuBtn")) return;

  const btn=document.createElement("button");
  btn.id="uiMobileMenuBtn";
  btn.className="ui-mobile-menu-btn";
  btn.type="button";
  btn.setAttribute("aria-label","Open menu");
  btn.innerHTML="☰";

  const overlay=document.createElement("div");
  overlay.className="ui-mobile-overlay";

  const close=document.createElement("button");
  close.className="ui-mobile-close";
  close.type="button";
  close.setAttribute("aria-label","Close menu");
  close.innerHTML="×";

  sidebar.prepend(close);
  document.body.appendChild(overlay);

  const brand=header.querySelector(".brand");
  if(brand && brand.parentNode) brand.parentNode.insertBefore(btn,brand.nextSibling);
  else header.insertBefore(btn,header.firstChild);

  function openMenu(){
    sidebar.classList.add("ui-open");
    overlay.classList.add("open");
    document.body.style.overflow="hidden";
  }
  function closeMenu(){
    sidebar.classList.remove("ui-open");
    overlay.classList.remove("open");
    document.body.style.overflow="";
  }

  btn.addEventListener("click",openMenu);
  close.addEventListener("click",closeMenu);
  overlay.addEventListener("click",closeMenu);
  sidebar.querySelectorAll("a").forEach(a=>a.addEventListener("click",closeMenu));
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
})();
</script>
