<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>My Products | iTech Customer</title><link href="../css/style.css" rel="stylesheet"/><link href="../css/dashboard.css" rel="stylesheet"/><style>.customer-card{background:#fff;border:1px solid #e3ebf5;border-radius:18px;padding:20px;box-shadow:0 10px 28px rgba(17,50,91,.07)}.customer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.customer-stat{background:#f8fbff;border:1px solid #e0e9f4;border-radius:14px;padding:17px}.customer-stat small{display:block;color:#71819b;font-weight:700}.customer-stat strong{display:block;font-size:25px;margin-top:8px;color:#10284b}@media(max-width:900px){.customer-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.customer-grid{grid-template-columns:1fr}}</style><link href="../css/unified-dashboard.css" rel="stylesheet"/> <link href="../css/dashboard-shell.css" rel="stylesheet"/>
<link href="../css/ui-enhancements.css" rel="stylesheet"/>
<link href="../css/mobile-app-ready.css" rel="stylesheet"/>
<link href="../css/itech-final-ui.css" rel="stylesheet"/></head><body><header class="dash-header"><a class="brand" href="dashboard.html"><img alt="iTech IT Solutions" class="brand-logo" src="../assets/itech-logo.png"/> </a><a class="btn secondary" data-logout="" href="../pages/login.html">Logout</a></header><div class="dash-layout"><aside class="sidebar"><nav><a href="dashboard.html">Dashboard</a><a href="products.html">My Products</a><a href="services.html">My Services</a><a href="payments.html">Payments</a><a href="register-product.html">Register Product</a></nav></aside><main class="dash-main"><div class="toolbar"><div><p class="eyebrow">CUSTOMER PORTAL</p><h1>My Products</h1></div></div><section class="customer-card"><div class="grid" id="cards"><p class="muted">Loading...</p></div></section><div class="status" data-status=""></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>(async()=>{const a=await requireCustomer();if(!a)return;const c=await sb.from("customers").select("id").eq("auth_user_id",a.session.user.id).single();if(c.error)return showStatus(c.error.message,true);const r=await sb.from("product_approvals").select("*").eq("customer_id",c.data.id).order("created_at",{ascending:false});if(r.error)return showStatus(r.error.message,true);const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");document.getElementById("cards").innerHTML=(r.data||[]).length?(r.data||[]).map(x=>`<article class="card"><div class="icon">🖥️</div><h3>${esc(x.product_name||x.name||"Product")}</h3><p class="muted">Serial: ${esc(x.serial_number||"—")}</p><p><span class="tag">${esc(x.status||"Pending")}</span></p><small>${esc(x.notes||"")}</small></article>`).join(""):`<p class="muted">No registered products yet.</p>`})()</script>

<script data-dashboard-active-nav="">
(() => {
  const current = location.pathname.split('/').pop() || 'dashboard.html';
  document.querySelectorAll('.sidebar nav a').forEach(a => {
    const href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];
    const file = href.split('/').pop();
    if (file === current) a.classList.add('active');
  });
})();
</script>
<script id="itech-mobile-navigation">
(function(){
  const header=document.querySelector(".dash-header");
  const sidebar=document.querySelector(".sidebar");
  if(!header || !sidebar || document.getElementById("uiMobileMenuBtn")) return;

  const btn=document.createElement("button");
  btn.id="uiMobileMenuBtn";
  btn.className="ui-mobile-menu-btn";
  btn.type="button";
  btn.setAttribute("aria-label","Open menu");
  btn.innerHTML="☰";

  const overlay=document.createElement("div");
  overlay.className="ui-mobile-overlay";

  const close=document.createElement("button");
  close.className="ui-mobile-close";
  close.type="button";
  close.setAttribute("aria-label","Close menu");
  close.innerHTML="×";

  sidebar.prepend(close);
  document.body.appendChild(overlay);

  const brand=header.querySelector(".brand");
  if(brand && brand.parentNode) brand.parentNode.insertBefore(btn,brand.nextSibling);
  else header.insertBefore(btn,header.firstChild);

  function openMenu(){
    sidebar.classList.add("ui-open");
    overlay.classList.add("open");
    document.body.style.overflow="hidden";
  }
  function closeMenu(){
    sidebar.classList.remove("ui-open");
    overlay.classList.remove("open");
    document.body.style.overflow="";
  }

  btn.addEventListener("click",openMenu);
  close.addEventListener("click",closeMenu);
  overlay.addEventListener("click",closeMenu);
  sidebar.querySelectorAll("a").forEach(a=>a.addEventListener("click",closeMenu));
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
})();
</script>
</body></html>
