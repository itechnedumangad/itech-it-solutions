.product-card{padding:18px;border:1px solid #e2eaf3;border-radius:16px;background:#fff;box-shadow:0 8px 22px rgba(17,50,91,.06)}
.package-label{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;color:#a85d00;background:#fff3df;border-radius:999px;padding:5px 9px;margin:3px 0 8px}
.product-notes{color:#52657d;margin:8px 0}
.package-details{margin-top:12px;padding:12px;border:1px solid #dfe8f2;border-radius:12px;background:#f8fbff}
.package-items{display:grid;gap:8px;margin-top:9px}
.package-item{padding:9px 10px;border-radius:9px;background:#fff;border:1px solid #e2eaf3}
.package-item span,.package-item small{display:block;color:#657890;font-size:12px;margin-top:3px}
</style></head><body><header class="dash-header"><a class="brand" href="dashboard.html"><img alt="iTech IT Solutions" class="brand-logo" src="../assets/itech-logo.png"/> </a><a class="btn secondary" data-logout="" href="../pages/login.html">Logout</a></header><div class="dash-layout"><aside class="sidebar"><nav><a href="dashboard.html">Dashboard</a>
<a href="products.html" class="active">My Products</a>

<a href="payments.html">Payments</a>
<a href="vehicle-insurance.html">🚗 Vehicle Insurance</a>
<a href="customer-bill.html">Customer Bill</a>
<a href="register-product.html">Register Product</a>
<a href="change-password.html">Change Password</a></nav></aside><main class="dash-main"><div class="toolbar"><div><p class="eyebrow">CUSTOMER PORTAL</p><h1>My Products</h1></div></div><section class="customer-card"><div class="grid" id="cards"><p class="muted">Loading...</p></div></section><div class="status" data-status=""></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>(async()=>{
  const a=await requireCustomer();
  if(!a)return;
  const c=await sb.from("customers").select("id").eq("auth_user_id",a.session.user.id).single();
  if(c.error)return showStatus(c.error.message,true);
  const r=await sb.from("product_approvals").select("*").eq("customer_id",c.data.id).order("created_at",{ascending:false});
  if(r.error)return showStatus(r.error.message,true);
  const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
  const items=x=>Array.isArray(x.package_items)?x.package_items:[];
  document.getElementById("cards").innerHTML=(r.data||[]).length?(r.data||[]).map(x=>`<article class="card product-card"><div class="icon">${x.product_type==="package"?"📦":"🖥️"}</div><h3>${esc(x.product_name||x.name||"Product")}</h3>${x.product_type==="package"?`<div class="package-label">PACKAGE / ASSEMBLED PRODUCT</div>`:""}<p class="muted">${x.serial_number?`Serial: ${esc(x.serial_number)}`:"Serial: —"}</p><p><span class="tag">${esc(x.status||"Pending")}</span></p>${x.notes?`<p class="product-notes">${esc(x.notes)}</p>`:""}${items(x).length?`<div class="package-details"><strong>📦 Included Products (${items(x).length})</strong><div class="package-items">${items(x).map(i=>`<div class="package-item"><strong>${esc(i.name||"Component")}</strong><span>Serial: ${esc(i.serial_number||"—")}</span>${i.notes?`<small>${esc(i.notes)}</small>`:""}</div>`).join("")}</div></div>`:""}</article>`).join(""):`<p class="muted">No registered products yet.</p>`;
})()</script>

<script data-dashboard-active-nav="">
(() => {
  const current = location.pathname.split('/').pop() || 'dashboard.html';
  document.querySelectorAll('.sidebar nav a').forEach(a => {
    const href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];
    const file = href.split('/').pop();
    if (file === current) a.classList.add('active');
  });
})();
</script>
<script id="itech-mobile-navigation">
(function(){
  const header=document.querySelector(".dash-header");
  const sidebar=document.querySelector(".sidebar");
  if(!header || !sidebar || document.getElementById("uiMobileMenuBtn")) return;

  const btn=document.createElement("button");
  btn.id="uiMobileMenuBtn";
  btn.className="ui-mobile-menu-btn";
  btn.type="button";
  btn.setAttribute("aria-label","Open menu");
  btn.innerHTML="☰";

  const overlay=document.createElement("div");
  overlay.className="ui-mobile-overlay";

  const close=document.createElement("button");
  close.className="ui-mobile-close";
  close.type="button";
  close.setAttribute("aria-label","Close menu");
  close.innerHTML="×";

  sidebar.prepend(close);
  document.body.appendChild(overlay);

  const brand=header.querySelector(".brand");
  if(brand && brand.parentNode) brand.parentNode.insertBefore(btn,brand.nextSibling);
  else header.insertBefore(btn,header.firstChild);

  function openMenu(){
    sidebar.classList.add("ui-open");
    overlay.classList.add("open");
    document.body.style.overflow="hidden";
  }
  function closeMenu(){
    sidebar.classList.remove("ui-open");
    overlay.classList.remove("open");
    document.body.style.overflow="";
  }

  btn.addEventListener("click",openMenu);
  close.addEventListener("click",closeMenu);
  overlay.addEventListener("click",closeMenu);
  sidebar.querySelectorAll("a").forEach(a=>a.addEventListener("click",closeMenu));
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
})();
</script>
