<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Services | iTech Customer</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/dashboard.css"><style>.customer-card{background:#fff;border:1px solid #e3ebf5;border-radius:18px;padding:20px;box-shadow:0 10px 28px rgba(17,50,91,.07)}.customer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.customer-stat{background:#f8fbff;border:1px solid #e0e9f4;border-radius:14px;padding:17px}.customer-stat small{display:block;color:#71819b;font-weight:700}.customer-stat strong{display:block;font-size:25px;margin-top:8px;color:#10284b}@media(max-width:900px){.customer-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.customer-grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="../css/unified-dashboard.css"></head><body><header class="dash-header"><a class="brand" href="dashboard.html"><img class="brand-logo" src="../assets/itech-logo.png" alt="iTech IT Solutions"> </a><a class="btn secondary" href="../pages/login.html" data-logout>Logout</a></header><div class="dash-layout"><aside class="sidebar"><nav><a href="dashboard.html">Dashboard</a><a href="products.html">My Products</a><a href="services.html">My Services</a><a href="payments.html">Payments</a><a href="register-product.html">Register Product</a></nav></aside><main class="dash-main"><div class="toolbar"><div><p class="eyebrow">CUSTOMER PORTAL</p><h1>My Services</h1></div></div><section class="customer-card"><div class="table-scroll"><table class="data-table"><thead><tr><th>Date</th><th>Service</th><th>Device</th><th>Status</th><th>Details</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section><div data-status class="status"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script>(async()=>{const a=await requireCustomer();if(!a)return;const c=await sb.from("customers").select("id").eq("auth_user_id",a.session.user.id).single();if(c.error)return showStatus(c.error.message,true);const r=await sb.from("service_requests").select("*").eq("customer_id",c.data.id).order("created_at",{ascending:false});if(r.error)return showStatus(r.error.message,true);const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");document.getElementById("rows").innerHTML=(r.data||[]).length?(r.data||[]).map(x=>`<tr><td>${x.created_at?new Date(x.created_at).toLocaleDateString("en-IN"):"—"}</td><td><b>${esc(x.service_name||x.service||x.category||"Service Request")}</b></td><td>${esc(x.device||x.device_name||x.brand_model||"—")}</td><td>${esc(x.status||"Submitted")}</td><td>${esc(x.problem||x.description||x.message||"")}</td></tr>`).join(""):`<tr><td colspan="5">No service requests found.</td></tr>`})()</script></body></html>
