<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Product Registration | iTech IT Solutions</title><link href="../css/style.css" rel="stylesheet"/><link href="../css/unified-dashboard.css" rel="stylesheet"/><link href="../css/public-polish.css" rel="stylesheet"/>
<link href="../css/mobile-app-ready.css" rel="stylesheet"/>
<link href="../css/itech-final-ui.css" rel="stylesheet"/></head><body><header class="site-header"><div class="nav-wrap"><a class="brand" href="../index.html"><img alt="iTech IT Solutions" class="brand-logo" src="../assets/itech-logo.png"/> </a><button class="menu" id="menu">☰</button><nav class="nav" id="nav"><a href="../index.html">Home</a><a href="services.html">Services</a><a href="works.html">Our Works</a><a href="enquiry.html">Enquiry</a><a href="service-register.html">Service</a><a href="product-register.html">Product</a><a href="login.html">Login</a></nav></div></header><section class="page-hero"><p class="eyebrow">PRODUCT REGISTRATION</p><h1>Register Product</h1><p>Register your purchased product for admin approval.</p></section><main class="container"><form class="panel form" id="productForm"><label class="field">Product Name<input name="product_name" required=""/></label><label class="field">Brand<input name="brand"/></label><label class="field">Model<input name="model"/></label><label class="field">Serial Number<input name="serial_number"/></label><label class="field">Purchase Date<input name="purchase_date" type="date"/></label><label class="field">Invoice Number<input name="invoice_number"/></label><button class="btn primary">Submit for Approval</button><div class="status" id="formStatus"></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/site.js"></script><script>(async()=>{const C=window.APP_CONFIG||{},k=C.SUPABASE_PUBLISHABLE_KEY||C.SUPABASE_ANON_KEY,s=window.supabase?.createClient(C.SUPABASE_URL,k);document.getElementById("productForm").onsubmit=async e=>{e.preventDefault();const st=document.getElementById("formStatus");if(!s)return st.textContent="Supabase is not configured.";const{data:{user}}=await s.auth.getUser();if(!user)return st.textContent="Please login before registering a product.";const c=await s.from("customers").select("id").eq("auth_user_id",user.id).maybeSingle();if(!c.data)return st.textContent="Customer profile not found.";const d=Object.fromEntries(new FormData(e.target));d.customer_id=c.data.id;const r=await s.from("product_registrations").insert(d);st.textContent=r.error?"Error: "+r.error.message:"Product registration submitted successfully.";if(!r.error)e.target.reset()}})();</script>
