<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register a Service | iTech IT Solutions</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/unified-dashboard.css"><link rel="stylesheet" href="../css/public-polish.css">

</head><body><header class="site-header"><div class="nav-wrap"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/itech-logo.png" alt="iTech IT Solutions"> </a><button id="menu" class="menu">☰</button><nav id="nav" class="nav"><a href="../index.html">Home</a><a href="services.html">Services</a><a href="works.html">Our Works</a><a href="enquiry.html">Enquiry</a><a href="service-register.html">Service</a><a href="product-register.html">Product</a><a href="login.html">Login</a></nav></div></header><section class="page-hero"><p class="eyebrow">CUSTOMER SERVICE</p><h1>Register a Service</h1><p>Submit a service request to iTech IT Solutions.</p></section><main class="container"><form id="serviceForm" class="panel form"><label class="field">Service / Category<input name="service_name" required placeholder="Computer Service"></label><label class="field">Device<input name="device" placeholder="Desktop / Laptop / Printer"></label><label class="field">Brand / Model<input name="brand_model"></label><label class="field">Problem / Requirement<textarea name="problem" rows="5" required></textarea></label><button class="btn primary">Register Service</button><div id="formStatus" class="status"></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/site.js"></script><script>(async()=>{const C=window.APP_CONFIG||{},k=C.SUPABASE_PUBLISHABLE_KEY||C.SUPABASE_ANON_KEY,s=window.supabase?.createClient(C.SUPABASE_URL,k);document.getElementById("serviceForm").onsubmit=async e=>{e.preventDefault();const st=document.getElementById("formStatus");if(!s)return st.textContent="Supabase is not configured.";const{data:{user}}=await s.auth.getUser();if(!user)return st.textContent="Please login before registering a service.";const c=await s.from("customers").select("id").eq("auth_user_id",user.id).maybeSingle();if(!c.data)return st.textContent="Customer profile not found.";const d=Object.fromEntries(new FormData(e.target));d.customer_id=c.data.id;const r=await s.from("service_requests").insert(d);st.textContent=r.error?"Error: "+r.error.message:"Service request submitted successfully.";if(!r.error)e.target.reset()}})();</script>
