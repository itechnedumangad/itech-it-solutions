<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Points | iTech Staff</title>
<link rel="stylesheet" href="../css/dashboard-shell.css">
<link rel="stylesheet" href="../css/ui-enhancements.css">
<link rel="stylesheet" href="../css/mobile-app-ready.css">
<style>
body{background:#f6f9fc;color:#183555}
.points-wrap{max-width:1100px;margin:0 auto;padding:20px}
.points-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.points-head h1{margin:0;color:#10284b}
.points-back{padding:9px 13px;border:1px solid #d7e2ec;border-radius:10px;text-decoration:none;background:#fff;color:#183555;font-weight:800;font-size:12px}
.points-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pk{background:#fff;border:1px solid #dce6ef;border-radius:16px;padding:16px}
.pk small{color:#708198}.pk strong{display:block;font-size:26px;margin-top:5px;color:#0d5aa7}
.points-history{margin-top:16px;background:#fff;border:1px solid #dce6ef;border-radius:16px;overflow:hidden}
.points-history h2{font-size:17px;margin:0;padding:16px;border-bottom:1px solid #e7eef4;color:#10284b}
.ph-row{display:grid;grid-template-columns:110px 1fr 110px 120px;gap:10px;padding:12px 16px;border-bottom:1px solid #edf2f6;font-size:12px}
.ph-row b{color:#0d5aa7}.muted{color:#7b8a9c}
@media(max-width:700px){
 .points-wrap{padding:12px}.points-head{align-items:flex-start}.points-kpis{grid-template-columns:repeat(2,1fr)}
 .ph-row{grid-template-columns:1fr auto}.ph-row .ph-date{grid-column:1/2}.ph-row .ph-type{grid-column:1/2}.ph-row .ph-pts{grid-column:2/3;grid-row:1/3;text-align:right}
}
</style>

<!-- SEO: private application page -->
<meta name="robots" content="noindex, nofollow">

</head>
<body>
<div class="points-wrap">
  <div class="points-head"><div><div class="muted">STAFF</div><h1>⭐ My Points</h1></div><a class="points-back" href="dashboard.html">← Dashboard</a></div>
  <div class="points-kpis">
    <div class="pk"><small>Today</small><strong id="pToday">0</strong></div>
    <div class="pk"><small>Yesterday</small><strong id="pYesterday">0</strong></div>
    <div class="pk"><small>This Month</small><strong id="pMonth">0</strong></div>
    <div class="pk"><small>Total</small><strong id="pTotal">0</strong></div>
  </div>
  <div class="points-history">
    <h2>Points History</h2>
    <div id="pHistory"><div style="padding:20px" class="muted">Loading…</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script>
(async function(){
 try{
   const u=await sb.auth.getUser(), uid=u.data?.user?.id;
   if(!uid){location.href="../pages/login.html";return;}
   const {data,error}=await sb.from('staff_points')
     .select('points,point_type,work_date,description,created_at')
     .eq('staff_id',uid).order('work_date',{ascending:false}).order('created_at',{ascending:false}).limit(500);
   if(error) throw error;
   const rows=data||[], now=new Date(), t=new Date(now.getFullYear(),now.getMonth(),now.getDate()), y=new Date(t); y.setDate(y.getDate()-1);
   let today=0,yes=0,month=0,total=0;
   rows.forEach(r=>{
     const n=Number(r.points||0); total+=n;
     const d=new Date(String(r.work_date).slice(0,10)+'T00:00:00');
     if(+d===+t)today+=n; if(+d===+y)yes+=n;
     if(d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth())month+=n;
   });
   const fmt=n=>n.toLocaleString('en-IN',{maximumFractionDigits:2});
   pToday.textContent=fmt(today);pYesterday.textContent=fmt(yes);pMonth.textContent=fmt(month);pTotal.textContent=fmt(total);
   pHistory.innerHTML=rows.length?rows.map(r=>`<div class="ph-row"><span class="ph-date">${r.work_date||'—'}</span><span class="ph-type">${String(r.point_type||'Points').replace(/[&<>"']/g,'')}</span><b class="ph-pts">+${fmt(Number(r.points||0))}</b><span class="muted">${String(r.description||'')}</span></div>`).join(''):'<div style="padding:20px" class="muted">No points yet.</div>';
 }catch(e){console.error(e);pHistory.innerHTML='<div style="padding:20px;color:#b33">Unable to load points. Make sure the Staff Points SQL migration is run.</div>';}
})();
</script>
</body>
</html>
